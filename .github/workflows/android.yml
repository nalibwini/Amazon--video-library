name: Build Amazon Video Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK from ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f \( -iname '*.zip' \) -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found in the repository root."
            echo "Upload the Amazon Video Library project as a .zip file and commit it."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf .build-source
          mkdir -p .build-source

          unzip -q "$ZIP_FILE" -d .build-source

          PROJECT_DIR="$(find .build-source -type f -name package.json -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            echo "The ZIP must contain the complete Capacitor project."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -f "$PROJECT_DIR/capacitor.config.ts" ] && [ ! -f "$PROJECT_DIR/capacitor.config.json" ]; then
            echo "ERROR: capacitor.config.ts or capacitor.config.json was not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/www" ]; then
            echo "WARNING: www/ directory was not found."
            echo "The build may fail if the Capacitor web assets are missing."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.prepare.outputs.project_dir }}/package.json

      - name: Install dependencies
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          npm install
          npm install -D typescript
          npm install @capacitor/android

      - name: Ensure Android platform exists
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "Android platform not found. Creating it with Capacitor..."
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build Android APK
        working-directory: ${{ steps.prepare.outputs.project_dir }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amazon-Video-Library-APK
          path: ${{ steps.prepare.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
