name: Build Amazon Video Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="Amazon_Video_Library_GitHub_Ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE haipo kwenye repository."
            exit 1
          fi

          echo "ZIP imepatikana: $ZIP_FILE"

      - name: Extract project
        id: prepare
        shell: bash
        run: |
          set -e

          rm -rf build-source
          mkdir -p build-source

          unzip -q "Amazon_Video_Library_GitHub_Ready.zip" -d build-source

          PROJECT_DIR=$(find build-source -type f -name "package.json" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json haikupatikana ndani ya ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: 22
      - name: Install dependencies
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Capacitor
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if ! node -e "require.resolve('@capacitor/cli')" >/dev/null 2>&1; then
            echo "Capacitor CLI haipo. Inawekwa..."
            npm install --save-dev @capacitor/cli
          fi

          if ! node -e "require.resolve('@capacitor/android')" >/dev/null 2>&1; then
            echo "Capacitor Android haipo. Inawekwa..."
            npm install @capacitor/android
          fi

          echo "Capacitor iko tayari."

      - name: Prepare Capacitor config
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -f capacitor.config.ts ]; then
            echo "capacitor.config.ts imepatikana."

            node <<'NODE'
          const fs = require("fs");
          const ts = require("typescript");

          const input = fs.readFileSync("capacitor.config.ts", "utf8");

          const result = ts.transpileModule(input, {
            compilerOptions: {
              target: ts.ScriptTarget.ES2020,
              module: ts.ModuleKind.CommonJS,
              esModuleInterop: true
            }
          });

          fs.writeFileSync(
            "capacitor.config.js",
            result.outputText
          );
          NODE

            mv capacitor.config.ts capacitor.config.ts.backup
          fi

          if [ ! -f capacitor.config.js ] && [ ! -f capacitor.config.json ]; then
            echo "ERROR: Capacitor configuration haipo."
            exit 1
          fi

      - name: Add Android platform
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            echo "Android platform haipo. Inaongezwa..."
            npx cap add android
          else
            echo "Android platform tayari ipo."
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build APK
        working-directory: ${{ steps.prepare.outputs.project_dir }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK haikutengenezwa."
            exit 1
          fi

          echo "APK IMETENGENEZWA:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amazon-Video-Library-APK
          path: ${{ steps.prepare.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
