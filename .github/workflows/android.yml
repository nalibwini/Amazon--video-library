name: Build Amazon Video Library APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK from ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find and extract project ZIP
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./Amazon_Video_Library_GitHub_Ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository root."
            exit 1
          fi

          rm -rf .build-source
          mkdir -p .build-source

          unzip -q "$ZIP_FILE" -d .build-source

          PROJECT_DIR="$(find .build-source -type f -name package.json -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -f "$PROJECT_DIR/capacitor.config.ts" ] && \
             [ ! -f "$PROJECT_DIR/capacitor.config.js" ] && \
             [ ! -f "$PROJECT_DIR/capacitor.config.json" ]; then
            echo "ERROR: No Capacitor configuration file was found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/www" ]; then
            echo "WARNING: www/ directory was not found."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.prepare.outputs.project_dir }}/package.json

      - name: Install project dependencies
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          npm install
          npm install --include=dev --save-dev typescript

          if ! node -e "require.resolve('@capacitor/android')" >/dev/null 2>&1; then
            echo "Capacitor Android package not found. Installing it..."
            npm install @capacitor/android
          fi

          node -e "console.log('TypeScript:', require.resolve('typescript'))"
          node -e "console.log('Capacitor CLI:', require.resolve('@capacitor/cli'))"
          node -e "console.log('Capacitor Android:', require.resolve('@capacitor/android'))"

      - name: Prepare Capacitor configuration
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f capacitor.config.ts ]; then
            echo "Transpiling capacitor.config.ts to JavaScript..."

            node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');

          const input = fs.readFileSync('capacitor.config.ts', 'utf8');

          const result = ts.transpileModule(input, {
            compilerOptions: {
              target: ts.ScriptTarget.ES2020,
              module: ts.ModuleKind.CommonJS,
              esModuleInterop: true,
              moduleResolution: ts.ModuleResolutionKind.NodeJs
            },
            reportDiagnostics: true
          });

          if (result.diagnostics && result.diagnostics.length > 0) {
            for (const diagnostic of result.diagnostics) {
              console.error(
                ts.flattenDiagnosticMessageText(
                  diagnostic.messageText,
                  '\n'
                )
              );
            }

            process.exit(1);
          }

          fs.writeFileSync(
            'capacitor.config.js',
            result.outputText
          );
          NODE

            mv capacitor.config.ts capacitor.config.ts.original
          fi

          echo "Capacitor configuration prepared."
          ls -la capacitor.config.*

      - name: Ensure Android platform exists
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "Android platform not found. Creating it with Capacitor..."
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build Android APK
        working-directory: ${{ steps.prepare.outputs.project_dir }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amazon-Video-Library-APK
          path: ${{ steps.prepare.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
